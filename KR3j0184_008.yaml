body:
  text: 言行龜鑑卷八元張光祖撰兵政門錢宣靖公嘗率衆過河號令軍伍分布行列悉有規節深為戍將所服上知之謂左右曰朕嘗見儒人談兵不過講之於尊俎硯席之間於文字則引孫吳述形勢皆閒暇時清論可也責之於用則罕有成功者今若水亦儒特曉武事深可嘉也陳公執中知青州兼一路安撫使索民錢數萬貫修城民間苦之㑹賊王倫起沂州入青州境執中遣傅永吉掩擊盡獲之上聞之嘉永吉以為能超遷閣門使入見上稱美其功永吉對曰臣非能有所成皆陳執中授臣節度臣奉行之幸有成耳因極言執中之美上益多永吉之讓而賢執中謂宰相曰陳執中在青州久可召之遂以執中參知政事張忠定公復知成都公至府問城中所屯兵尚三萬人無半月之食公訪知鹽價素髙而廩有餘積乃下其估聽民得以米易鹽於是民爭趨之未踰月得米數十萬斛軍中喜而呼曰前所給米皆雜糠土不可食今一一精好此翁真善幹國事者薛公長孺為漢州通判戍卒閉營門放火殺人謀殺知州兵馬監押有來告者挺身叩營諭之曰汝輩皆有父母妻子何故作此事然不與謀者各在一邊於是不敢動惟本謀者八人突門而出散於諸縣相繼捕獲是時非公則一城之人盡遭塗炭矣种世衡將軍城青澗元昊寇邊有并吞關中之意其將綱哩拉號雅哩克王某號天都王各統精兵於别部元昊倚為心腹將軍謀有以去之有王嵩者為人堅朴白於帥府表充經略司指揮凡居室騎從衣食之具悉出將軍嵩感恩既深將軍反不禮以奴畜之或掠治械繫數日嵩乃不勝其苦卒無一辭怨望將軍知可任以事居半年召嵩謂之曰吾將以事使汝嵩泣對曰嵩貧賤無狀蒙將軍恩致身榮顯常誓以死報而未知其所况敢辭捶楚乎將軍乃遺雅哩克書書辭大抵如世間問起居之儀别以數語隱辭書於尺素且膏以蠟置衲衣間密縫之告嵩此非濵死不得泄如泄之當以負恩不能成吾事為言并以畫龜一幅棗一部為信牌遺雅哩克嵩受教至雅哩克所居致將軍命出棗龜投之雅哩克知見侮笑曰吾素竒种將軍今何兒女子見識度嵩别有書索之嵩佯目左右既而答以無有雅哩克不敢匿乃封其信上元昊數日元昊召雅哩克與嵩俱西北行數百里至一大城曰興州先詣一官寺曰樞密院次曰中書有數畨雜坐雅哩克預焉召嵩庭詰將軍書問所在嵩堅執前對稍稍去巾櫛加執縛至於捶楚極苦嵩終不易其言又數日召入一官寺㕔事廣楹皆垂斑竹箔緑衣小豎立其左右嵩意元昊宫室也少頃箔中有人出又以前問責之曰若不速言死矣嵩對如前乃命曳出誅之嵩大號且言曰始將軍遣嵩密遺雅哩克書戒不得妄泄今不幸空死不了將軍事吾負將軍吾負將軍箔中急使人追問之嵩具以對乃褫衲衣取書以進書入移刻始命嵩就館優待以禮元昊於是疑雅哩克隂遣愛將假為雅哩克使於將軍將軍知元昊所遣未即見命屬官日館勞之問西夏山川地形在興州左右言則詳迫雅哩克所部多不能悉適擒西夏數人因令隙中視之夏人能言其姓名果元昊使將軍意决乃見之將軍燕服據案坐屬官皆朝衣抱文籍鳬鴈侍左右於是賔贊引使者出拜使者𫝊雅哩克語將軍慢罵元昊而稱雅哩克有心內附乃厚遣使者曰為吾語若主速决無遲留也度使者至嵩即還而雅哩克已報死矣將軍知謀已行因欲并間天都又為置祭境上作文書於版以弔多述雅哩克與天都相結有意本朝悼其垂成而失其文雜紙幣伺有敵至急爇之以歸版字不可遽滅西夏得之以獻元昊天都以此亦得罪元昊既失二將久之始悟為將軍所賣遂定講和之䇿世衡嘗以罪怒一畨落將杖其背僚屬為之請莫能得其人被杖已奔趙元昊甚親信之得出入樞密院嵗餘盡詗得其機事以歸衆乃知世衡用為間也范文正公領延安閲兵選將日夕訓練又親戒諸路養兵蓄鋭毋得輕動夏人聞之相戒曰無以延州為意今小范老子腹中自有數萬甲兵不比大范老子可欺也戎人呼知州為老子大范謂雍也狄武襄公青自請擊儂智髙以青為荆湖南北路宣撫使經制廣南東西路盜賊事諌官韓絳上言狄青武人不足専任固請以侍從文臣為之副上以訪執政時龎籍獨為相對曰屬者王師所以屢敗皆由大將權輕偏禆人人自用遇賊或進或退力不能制也今青起於行伍若以侍從之臣副之復視青如無青之號令復不得行是循覆車之軌也青素善戰今以二府將大兵討賊若又不勝不惟嶺南非陛下之有荆湖江南皆可憂矣青昔在鄜延居臣麾下沉勇有智略若専以智髙事委之必能辦賊上曰善於是詔嶺南用兵皆受青節度處置民事則與孫沔等議之智髙陷賔州復入雍州十一月青至湖南諸道兵皆㑹余靖遣廣南西路鈐轄陳某將萬人擊智髙逗留不進戰敗遁歸道死者二千餘人時饋運未至青初令備五日糧既又備十日糧智髙聞之由是懈惰不為備上元張燈髙㑹先是諸將視其帥如僚宷無所嚴憚每議事喧爭不用命己酉狄青悉集將佐於幕府立陳某於庭下數其敗軍之罪并軍校數十人皆斬之諸將股栗莫敢仰視於是勒兵而進步騎二萬或說儂智髙守崑崙關智髙驟勝輕官軍不用其言公倍道兼行出崑崙關直趣其城智髙出戰大敗殺獲三千餘人智髙走還城官軍追至城下智髙夜棄城走奔大理捷書至上喜謂龎籍曰嶺南之平皆卿功也青宣撫廣西時儂智髙守崑崙關青至賔州值上元節令大張燈燭首夜燕將佐次夜燕從軍官三夜饗軍校首夜樂飲徹曉次夜二更時青忽稱疾暫起如內久之使人諭孫元規令暫主席行酒少服藥乃出數使人勸勞座客至曉各未敢退忽有人馳報云是夜三鼓公已奪崑崙矣司馬溫公嘗曰並馳萬馬中能駐足者其惟王存乎詹良臣字唐公嚴州人以纍舉恩得官為縉雲尉方臘起青溪聲搖江淮賊犯處州良臣曰捕盜吾職也率弓兵數十人往禦之為賊所執賊欲降之良臣罵曰汝輩何敢反往年李順反戮於蜀王倫反戮於淮南王則反戮於河北同惡無少長棄市尸為狗鼠食汝輩何敢反賊怒割其肉使自啖之良臣且吐且罵至死不絶聲見者為隕涕賊平官其二子李侍郎若水靖康二年金人攻陷太原屢以講和割地為說耿南仲之徒力主和議正月上如青城金人請上相見二月上皇帝后如青城俱留金營尼嗎哈逼上易服若水叩頭流血固爭不可若水死之金人曰我破大遼死義者十數南朝惟見李侍郎一人而已劉忠顯公韐初金入真定也父老號呼曰使劉資政韐在鎮豈有此禍金益知公名必欲得公宰相紿以割地遣公往金以其國僕射韓正館公於夀聖院正言國相尼瑪哈欲用公公曰偷生以事二姓有死不為也明年正月正見公言欲以公為正代許以家屬行公仰天大呼曰有是乎歸召指使陳灌等曰金人乃欲用我我當以死報國耳灌等泣且拜公曰死生命也寧為不義屈乎即手書片紙曰金人不以豫為有罪而以豫為可用夫正女不事二夫忠臣不事二君以順為正者妾婦之道也此豫所以有死也付灌持歸報諸子即沐浴更衣酌巵酒以衣絛自縊燕人嘆曰劉相公忠臣也劉公平與西夏戰于延州三川口戰少却都監內臣黃德和引兵先走平轉鬭三日賊問主將何在何不降平使人應之曰狗賊不降我何降也以衆寡不敵與石元孫俱被執平不復食數罵曰狗賊我頸長三尺何不速殺我縛我何之乎遂見殺張公克戩字德祥出知汾州金人陷燕山長驅而南分兵掠太原金兵來攻外援不至勢日孤危克戩畢力捍禦晝夜不少懈太原陷汾益危克戩召令軍民曰太原既陷吾固知亡矣然義不忍負朝廷辱父祖纍子孫不與此城同終始無以明吾節衆皆泣對曰公父母也願盡死拒守踰月城壞賊既入城克戩朝服南向焚香拜舞乃自引决其家死於難者凡八人
