body:
  text: 言行龜鑑卷五元張光祖撰出處門張全義末帝時纍遷太尉中書令封齊王凡四十年位極人臣善保終吉者蓋一人而已全義朴厚大度敦本務實起戰士而志功名不儒業而樂善道家非士族而奬愛衣冠開幕府辟士必求望實屬邑補奏不任吏人位極王公不衣羅綺心奉釋老而不溺左道如是數者人以為難後唐趙光逢為相常有女真寄黃金一鎰於其家適值亂離女真委貨於他所後二十年金無所歸納於河南尹張全義請付諸官觀其舊封尚在兩登廊廟四退丘園百行五常不欺暗室搢紳咸仰以為名教宗主周馮道初仕後唐長興中平章事明宗謂侍臣曰馮道性純儉頃在德勝寨所居一茅菴與從人同器食卧則芻藳一束其心晏如及以父憂退歸鄉里自耕耘樵採與農夫雜處曽不以素貴介懷真士大夫也道歷仕四朝二入中書在相位二十餘年以持重鎮俗為己任性亷儉不受四方之賂未嘗以片簡擾諸侯私門之內無纍茵無重味不畜姬僕不聽絲竹有寒素之士求見者必引於中堂語及平生其待遇也心無適莫故雖朝代遷貿人無問言屹若巨山不可轉也議者以為厚德稽古宏才偉量蓋漢胡廣晉謝安之徒歟蘇禹圭初仕漢為宰輔純厚長者遭漢祖與蘇逢吉同登相位漢末逢吉夷滅禹圭恬然無咎時人以為積善之報也士大夫不可爭名競進致有缺行玷平生之蹤跡昔張去華當太祖朝乞試有數知己皆館閣名臣保舉之太祖怒而問曰汝有多少文章得如陶穀曰不如敢與竇儀比試曰不敢汝與張淡比試遂遲遲不對遂令張淡比試試畢考校所試優於張淡然淡是季父自此去華一生不得入館閣蓋由是耳吕文穆公罷相上謂左右曰吕蒙正前自布衣朕擢為輔相今退在班列必望復位矣劉昌言曰蒙正雖驟登顯貴然其風望不為忝冒不聞蒙正之鬱悒也況今巖穴髙士不求榮達者甚多惟若臣輩茍且官祿不足以自重矣上默然錢若水言忠正之士不以窮達易志操其或以爵祿恩遇之故而效忠於上中人以下者之所為也上然之劉昌言罷上問趙鎔等曰昌言涕泣否曰與臣等談多至流涕若水曰昌言實未嘗流涕鎔等迎合上意耳若水因自念上待輔臣如此蓋未嘗有秉節髙邁不貪名勢能全進退之道以感動人主遂貽上之輕鄙將以滿嵗移疾遂草章求解職㑹晏駕不果上王內翰禹稱字元之性狷介數忤權貴宦官尤惡之上纍召至中書戒諭之禹稱終不改咸平初修太祖實録與宰相論不合又以謗責落職出知黃州作三黜賦以見志其卒章曰屈于身而不屈于道兮雖百謫其何虧吾當守正直而佩仁義兮惟終身而行之王司門繕調沂州録事參軍時魯宗道方為司户參軍家貧食衆祿俸不給每貸於王猶不足則又懇王豫貸俸鈔魯御下嚴庫吏深怨之訴魯私貸緡鈔州并劾王王諭魯曰第歸罪某君無承也王卒明魯不知而獨得私貸之罪魯深愧謝不自容王處之裕如無慊恨也由是沉困銓曺二十餘年晚用薦者引對吏部狀其功過奏目有魯姓名時魯已參大政立殿中仁廟目魯曰豈卿邪魯遽稱謝具呈其實仁宗嘆曰長者也先是有私過者例改次第由是得不降等詔改大理寺丞仕至省郎纍典名郡壽八十九卒亦庇賢為善之報也王文正公時諌議大夫張師德謁向文簡公曰師德兩詣王相公門皆不得見恐為人輕毁望公從容勸之一日方議知制誥公曰可惜張師德向公曰何謂公曰纍於上前說張師德名家子有士行不意兩及吾門狀元及第榮進素定但當靜以待之耳若復奔競使無階而進者當如何也向公方以師德之意啓之公曰旦處安得有人敢輕毁人但師德後進待我淺也向公因稱師德適有闕望公弗遺公曰苐緩之使師德知聊以戒貪進激薄俗也龎莊敏公籍知定州請老召還京師公陳請不已或謂公今精力完壯主上注意方厚何遽引去公曰必待筋力不支明主厭棄然後乃去是不得已豈止足之謂耶凡上表者九手疏二十餘通朝廷不能奪五年聽以太子太保致仕吕正獻公去就之際極其介潔在朝廷小不合便脫然無留意歷事四朝無一年不自引求去富韓公慶歷間為樞密副使辭愈力公言遼既通好議者便謂無事邊備漸弛遼萬一敗盟臣死且有罪非獨臣不敢受亦願陛下思外夷輕侮中原之恥坐薪嘗膽不忘修政因以告納上前而罷逾月復以命公時元昊使辭上俟公綴樞密院班乃坐且使章得象諭公曰此朝廷特用非以使遼故也公不得已乃受余公靖為諌官時范文正公言事忤大臣貶知饒州諌官緘口無敢言者余獨奏曰若習為常恐鉗天下之口不可不戒書既上落職監均州酒稅尹公洙歐陽修相繼抗疏論列又以書讓諌官髙若訥亦得罪逺謫時天下賢士大夫相與惜其去號為四賢蔡襄作四賢一不肖詩以記其事詩播都下包孝肅公吕文靖聞其才欲見之一日待漏院見班次有包拯名頗喜及歸又問知居同里巷意以拯欲便於求見無幾報拯朝辭乃就部注一知縣而出尤竒之遽使人追還遂薦對除裏行自此擢用韓公維弱不好進篤志問學嘗以進士薦禮部父任執政不就廷試乃以父任守將作監主簿丁外艱服除闔門不仕仁宗患搢紳奔競諭近臣曰恬退守道者旌擢則躁求者自當知恥于是宰相文彥博宋庠等言公好古嗜學安于靜退乞加甄録以厚風俗召試學士院辭不赴除國子監主簿陳恭公執中初罷政亳州年六十九遇生日親族獻壽獨其姪世修獻范蠡遊五湖圖且贊曰賢哉陶朱霸越平吳名遂身退扁舟五湖恭公甚喜即日表納節明年纍表求退遂以司徒致仕劉公敞前後升官未嘗輒讓惟初拜侍讀及除諌議辭之其心誠謂分所不冝處則不欲茍受之非以邀名也韓魏公常言君子與小人並處其必不勝則奉身而退樂道無悶也范忠宣公奏疏乞將吕大防等引赦原放忤大臣章惇落職知隨州公草疏時或以觸怒為解萬一逺謫非髙年所冝公曰我世受國恩事至于此無一人為上言者若上心遂回所繫非小設有不從果得罪死復何憾命家人促裝以俟謫命公在隨幾一年素苦目疾忽全失其明上表乞致仕惇戒堂吏不得上遂貶公武安軍節度副使永州安置命下公怡然就道人或謂公為近名公聞而嘆曰七十之年兩目俱喪萬里之行豈其欲哉但區區愛君之心不能自已人若避好名之嫌則無為善之路矣每諸子怨章惇公必怒止之江行赴貶所舟覆扶公出衣盡濕顧諸子曰此豈章惇為之哉至永州公之諸子聞韓少卿維謫均州其子告惇以少卿執政日與司馬公議論多不合得免行欲以公與司馬公議役法不同為言求歸白公公曰吾用君實薦以至宰相同朝論事不合即可汝輩以為今日之言不可也有愧而生者不若無愧而死諸子遂止公安置永州課兒孫誦書躬親教督常至夜分在永三年怡然自得或加以橫逆人莫能堪而公不為動亦未嘗含怒于後也每對賔客惟論聖賢修身行己餘及醫藥方書他事一語不出口而氣貌益康寧如在中州時司馬溫公事神宗時王安禮為右丞一日宰執同對有無人才之歎左丞蒲宗孟對曰人才半為司馬光以邪說壞之上不語正視宗孟久之宗孟懼甚無以為容上復曰蒲宗孟乃不取司馬光耶司馬光未論别事只辭樞密一節朕自即位以來惟見此一人他人則雖迫之使去亦不肯矣劉安世元城初除諌官未敢拜命入與娘子謀曰朝廷不以安世不肖誤除諌官這箇官職不比間慢差遣須與他朝廷理㑹事有所觸犯禍出不測朝廷方以孝治天下如以老母懇辭必無不可娘子曰不然諌官是天子爭臣我見你爺要做不能得你是何人蒙朝廷有此除授你果能補報朝廷假使得罪我不選甚處隨你去但做公遂備禮辭免尋便供職三日朝廷有大除拜公便上二十四章又論章惇十九章及得罪惇必欲見殺春循梅新髙竇雷化八州惡地安世歷遍七州又遭先妣喪禍與兒子輩扶護靈柩盛夏跣足日行數十里腳底都穿嘆曰今只老夫與兒子兩人在耳公在朝章惇於崑山縣强市民田人口經州縣監司次第陳訴皆不敢受理又經户部不敢治御史臺亦不彈劾公纍上疏極論曰按惇抱死黨之志而濟以隂謀藴大奸之才而輔之殘忍因緣王安石惠卿之黨遂得進用而造起邊隙徼幸富貴在先帝時已坐置田不法嘗罷執政蔡確引用再叨大任陛下嗣位擢置上樞而內懷姦謀沮毁聖政以致悖慢帷幄之前殊無臣子之禮及以家難退歸里閭而敢憑恃凶豪劫持州縣使無辜之民流離失業乞特賜竄殛仍委臺臣置院推劾其崑山蘇州及本路監司亦乞並行黜責章四上朝廷令發運司體究詔贖銅十斤公復爭之以為所責太輕未厭公議況惇與蔡確黃履邢恕素相交結天下指為四凶若不因其自致人言遂正典刑異日却欲竄逐深恐無名且干繫官吏因惇致罪皆處從坐惇係首惡之人乃止贖銅事理顛錯亦已太甚況下狀之日惇父尚在而别籍異財事義顯著考按律文罪入十惡愚民冒犯猶有常刑惇為大臣天下所望而虧損名教絶滅義理止從薄罰何以示懲聖人制法惟務至公若行於匹夫而廢於公卿伸於愚民而忽於貴近此乃姑息之弊非清朝之所冝行也蔡確雖貶尚與章惇等自謂有定䇿功創造語言恐脅貴近為中外憂劉安世復言曰臣近嘗進對論確朋黨雖粗陳大槩未能盡達天聽事體至重不可不憂臣聞蔡確章惇黃履邢恕四人者在元豐之末號為死黨惇確執政倡之於內履為中丞與其僚屬和之於外恕立其間往來𫝊送天下之事在其掌握聖上嗣位四人者以為有定䇿之功眩惑中外若不早為辨正恐異日必為朝廷之患臣聞元豐七年秋宴之日今上皇帝出見羣臣都下喧𫝊以為盛事明年神宗皇帝晏駕衆謂前日之出已示與子之意其事一也自先帝違豫嘉政二王日詣寢殿候問起居及疾勢稍增太皇太后即時面諭並令還宫非遇宣召不得輒入有以見聖心無私保佑慎重其事二也建儲之際大臣未嘗啓沃而太皇太后內出皇帝為神考祈福手書佛經宣示執政稱美仁孝發於天性遂令下詔誕告外庭蓋事已先定不假外助其事三也陛下聽政之初首建親賢之宅才告畢工二王即遷就外第天下之人莫不服陛下之聖明深得逺嫌之理其事四也此實太皇太后聖慮深逺為宗廟社稷無窮之計彼四人者乃敢貪天之功以為己力伏望明詔執政及當時受遺之臣同以親見䇿立今上事跡作為金縢之書藏之禁中又以其事本末著實録然後明正四凶之罪布告天下除蔡確近已貶竄外所有章惇黃履邢恕欲乞並行逐之逺方終身不齒所貴姦豪屏息它日無患由是三人皆得罪劉元城遭貶章惇蔡卞用事欲殺公者甚至凡甲令所載稱逺惡州軍無所不至雖盛夏令所在州軍監督日行一舍或泛海往來貶所人謂公必死然七年間未嘗一日病年幾八十堅悍不衰公貶梅州忽有所厚士類數輩至輒相向垂淚公曰豈非安世有後命乎客曰屬聞朝廷遣使入郡將不利于公願公自裁無辱時公貶所有土豪緣進納以入仕者因持厚資入京師求見惇直以能殺公意達之不數日薦上殿自選人改秩除本路轉運判官其人飛馭往驅至公貶所郡將遣其客來勸公治後事涕泣以言公色不動留客飲酒談笑自若對客取筆書數紙徐呼其僕曰聞朝廷賜我死即死依此行之謂客曰死不難矣客從其僕取紙閲之則皆經紀其家與同貶當死者之家事甚悉客驚以為不及俄報運使距郡城三十里而止翌日當至家人聞之亦號泣不食不能寐且治公後事而公起居飲食如平昔曽無少異至夜半伺公酣寢鼻息如雷忽聞鐘動上下驚曰鐘聲何太早也黎明問之鳴鐘者乃運判公一夕嘔血而斃矣明日有客唁公公亦無喜色范蜀公善文賦補國子監生及貢院奏名皆第一故事殿庭唱第過三人則為奏名之首必抗聲自陳以祈恩雖考校在下天子必擢置上列以吳春卿歐陽永叔之耿介猶不免從衆公獨不然左右及並立者屢趣之使自陳公不應至七十九人始唱名及之公出拜退就列訖無一言衆皆服其安恬自是始以自陳為恥舊風遂絶范蜀公力詆王安石青苗之法疏三上不行即請致仕蘇軾賀曰公雖退而名益重矣公愀然不樂曰君子言聽計從消患於未萌使天下隂受其賜無智名無勇功吾不得為此命也夫使天下受其害而吾享其名吾何心哉王介甫曰智者成之仁者守之溫公曰介甫誤矣君子難進易退小人反是若小人得路豈可去也王荆公介甫在政事堂只喫魚羮飯一日因事乞去云世間何處無魚羮飯胡文定公云只為介甫緣纍輕故去住自在范淳夫極為溫公奬識嘗為進論求教於公公每見則未始有可否淳父疑而質於公公久而言曰子之進論非不美也顧念世人獲甲科者絶少而子既已在前列而復習進論求應賢良以光觀之但有貪心耳光之不喜者非為進論也不喜子有貪心也淳夫於是焚去進論不應賢良公嘗從司馬溫公辟修歷代君臣事迹時王荆公當國人皆奔競公未嘗往謁王安國與公友善嘗諭荆公意以公獨不親附故未進用公竟不往見後章惇拜相公坐貶永州公平生淡然無欲家人不見其喜怒之容修書于洛有終焉之志及登侍從無時不求退每被除擢必力辭不得已然後就職及被貶責處之怡然嘗曰吾西蜀一布衣耳今復不仕何為不可蘇文忠公謫惠州以少子過自隨瘴癘所侵蠻蛋所侮胸中泊然無芥蒂惠人愛敬之四年安置昌化昌化非人所居食飲不具藥石無有僦官屋以庇風雨有司猶謂不可則買地築室縳草屋三間人不堪其憂公食芋飲水著書時從其父老遊亦無間也
