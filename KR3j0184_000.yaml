body:
  text: 提要雜家類五雜纂之屬言行龜鑑八卷臣等謹案言行龜鑑八卷元張光祖編光祖元史無傳志乘亦不載其名始末無可考見惟大德癸卯陳普作是書序稱襄國張君字紹先大德辛丑為泉州推官睹其厯仕為政信其為仁人君子又有大德甲辰熊禾序稱光祖質美嗜學有天下來世之志陳普即學者所稱石堂先生熊禾即學者所稱勿軒先生皆宋元間篤行醇儒不妄許可據其所言則光祖亦君子人矣初宋趙善璙作自警編録前輩嘉言善行以示矩矱光祖欲為刋行熊禾以善璙所編尚有未及刪潤者光祖乃即善璙舊本益以典刑録厚德録善善録名臣言行録及博採名臣碑志之文裒輯排比以成是編據原序稱分學問德行交際家道出處政事民政兵政八門黃虞稷千頃堂書目著録作八卷蓋一門為一卷也原序又稱類列八十有二枚舉為九百五十有五今原本散佚惟載於永樂大典者尚存四百七十二條而八十有二之子目則不可復考然唐以前分類之書不過撮舉大綱易於包括宋人著書好立子目目愈繁碎則分隸彌易糾紛今子目既已無徵惟以所立八門依類排纂轉覺便於循覽又原序稱每類之中首之以善行次之以嘉言先踐履後議論也然言行既各分編則一人之名一類中先後復出時代未免顛斘又或一事一人而言行並見尤難於割裂其體例殊為未善今惟以人統事以時代敘人庶端緒不淆釐然易見雖編次視原本稍殊而要之標舉芳蹤示人效法於光祖著書之本旨固未嘗失矣宋元説部諸書每雜述詼諧侈陳神怪以供文士之談資是編所記雖平近無竒而篤實切理足以資人之感發亦所謂布帛菽粟之文雖常而不可厭者歟乾隆四十六年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀原序人之善念如天地間生氣千古萬古無一日息君子兼善之念亦如主宰是氣者常惻惻在懷抱中茍得發用流行必思所以如吾心者古人所以坐待旦也唐以前逺矣姑據二三百年來名公卿賢大夫士天命之懿發於心見於修身齊家事君臨民其尤通徹無間隔者與禹稷顔孟如一人其發動生長不自覺而足為世典刑令甲者亦復不能悉數也是何天下之多賢耶豈不足以發明性命之不息起天下亹亹之心而永為斯民之所恃賴乎襄國張君光祖字紹先幼抱濟物之懷辛丑為泉州推官休暇俯仰慨然以天下為慮取朱文公言行録及前人採拾所謂典型録厚德録自警編善善録所載近世言行凡在於善類庶幾於道上足以禆明時下足以利民物者門分為八類列為八十有二枚舉為九百五十有五總名之曰言行龜鑑梓之與天下共凡以見人性之皆善若文公所謂因其所同推以度物者噫是心也足使物各得所而凡天下含淳粹抱昭明不能自止息者與身在正途而或未有扶翼之者讀此編足使惕息憤悱如寐得呼如獨行得侣幡然回車入康莊浩然插翮登寥廓一正身心而宇宙間咸受其賜豈不美哉余平生百無能唯於善之一字耿耿不能忘覩張君歷仕為政與其為此書實拳拳然信其為仁人君子也故為之序大德癸卯閏五月三山陳普書于同文書院余甲戌客武林閲書肆得趙善璙自警編觀其言皆切近而易知而其事又明白深至而易以動悟知其有補於世教也古襄張侯紹先一見喜之即欲刋板流布余再加翻閲見其編次似猶有未及刪潤者其序中所及杜氏典型録又得而閲之大略相似而用意尤嚴蓋二家託始各有微意自警編以廣問學充器識為先而典型録則以敦孝友崇操行為重且極言近世學者之病徒尚虛言不務實履知可千百而行不一二又將以深警夫學者用心之微也雖然人之氣質意見終有限惟學問義理為無窮子曰德之不修學之不講是吾憂也所謂講學者豈近世儒者記覽辭章之虛言哉大學之格物中庸之明善未嘗不在力行之先眼明足健知行並進萬里雖逺固有可期若懵無所睹欲不跌仆世豈有是理哉漢唐以下人物豈無天姿之暗合隨其所見亦足以有就然終不可以語聖賢事業者學之不講也紹先甚然余言於是合二家所編而律之以大學序次又參以朱夫子所編名臣言行録與夫近世見聞記録等書及諸賢碑志之類靡不搜輯首學問格物致知之事也次德行誠意正心修身之事也身修而後可以治人則有交際之道而家為近故繼之以家道居家理而後治可移於官則有出處之道故繼以出處而終於政事民政兵政則其大者也至此則齊家治國平天下之事畢矣紹先又出厚德録一編凡事涉於忠厚慈愛者率以録近世風俗日澆倫理益薄厚德之士吾見亦鮮矣厚者仁之道也學莫大於求仁德莫大於得仁一事之厚則一事近仁事事皆厚則事事近仁一家仁一國興仁以至於天下無一人不歸於仁則深所望於今與後之士也每類之中首之以善行次之以嘉言先踐履後議論也今人多謂能言不能行能行固難能言亦豈易哉六經諸子皆言也聖賢立德立功盡在是矣若夫以知言為外以窮理為煩而但欲隨資質所到以制行據智見所及以就功此固伊洛考亭諸儒所深戒而堯舜禹湯文武周孔之學所以不傳也紹先質美嗜學有天下來世之志而尤以躬行為重余辱交甚久見其出語措事一不敢忘古人格言大訓其為是編也與余切磋論辨為甚悉蓋一善不忍遺一事一言亦不茍於去取也書成屬余序之輒識其所以相與編次之意如此若漢唐諸賢嘉言善行嗣當以類而次輯云後三嵗甲辰是為大德八年八月初吉熊禾序
